<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balance the pendulum</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #25384a;
      --muted: #52677b;
      --surface: #ffffff;
      --border: #8b99a5;
      --hover: #e2e8f0;
      --cart: #d7e7ef;
      --blue: #1763a6;
      --orange: #ad4715;
      --button-ink: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --muted: #b1c2d1;
        --surface: #252930;
        --border: #859bb0;
        --hover: #354150;
        --cart: #34495e;
        --blue: #75baff;
        --orange: #f4a66a;
        --button-ink: #172b3a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 850px; margin: auto; padding: 16px; }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 5px 0 12px; }
    canvas { display: block; width: 100%; height: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
    .parameters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 14px 0 4px; }
    .parameters label { display: block; font-size: 14px; }
    .parameters output { display: block; font-variant-numeric: tabular-nums; font-weight: 600; }
    input[type="range"] { display: block; width: 100%; margin: 8px 0; accent-color: var(--blue); }
    .hint { color: var(--muted); font-size: 13px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    button { padding: 9px 14px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
    button:hover { background: var(--hover); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    button.held, #toggle { background: var(--blue); border-color: var(--blue); color: var(--button-ink); }
    .force { touch-action: none; user-select: none; }
    #readout { display: block; min-height: 24px; font-size: 14px; font-variant-numeric: tabular-nums; }
    #status { font-size: 14px; font-weight: normal; margin-left: 12px; color: var(--muted); }
    @media (max-width: 420px) { main { padding: 12px; } button { padding: 9px 11px; } }
  </style>
</head>
<body>
  <main>
    <h1>Balance the pendulum <span id="status" role="status">Paused</span></h1>
    <p>Start, then hold ← or → to push. The view follows the cart.</p>
    <div class="parameters" role="group" aria-label="Simulation parameters">
      <div>
        <label for="cart-mass">Cart mass <output id="cart-mass-value" for="cart-mass">1.0 kg</output></label>
        <input id="cart-mass" type="range" min="0.1" max="5" step="0.1" value="1" aria-describedby="mass-hint">
      </div>
      <div>
        <label for="rod-mass">Rod mass <output id="rod-mass-value" for="rod-mass">0.5 kg</output></label>
        <input id="rod-mass" type="range" min="0.1" max="5" step="0.1" value="0.5" aria-describedby="mass-hint">
      </div>
      <div>
        <label for="force-magnitude">Force magnitude <output id="force-magnitude-value" for="force-magnitude">2.0 N</output></label>
        <input id="force-magnitude" type="range" min="0" max="10" step="0.1" value="2">
      </div>
    </div>
    <p id="mass-hint" class="hint">Changing a mass resets and pauses the motion.</p>
    <canvas id="scene" role="img" aria-label="Animated rod on a cart. Upright is zero degrees; positive angles lean clockwise."></canvas>
    <div class="controls" aria-label="Simulation controls">
      <button id="toggle" type="button">Start</button>
      <button id="reset" type="button">Reset</button>
      <button id="left" class="force" type="button" aria-label="Hold to push left with 2 newtons">← Push left</button>
      <button id="right" class="force" type="button" aria-label="Hold to push right with 2 newtons">Push right →</button>
    </div>
    <output id="readout" aria-live="off" aria-label="Time, cart position, rod angle, and applied force"></output>
    <noscript><p>Enable JavaScript to run the demo. The article's free-motion plot shows the unforced trajectory.</p></noscript>
  </main>
  <script src="pendulum_demo.js"></script>
</body>
</html>
