<svg xmlns="http://www.w3.org/2000/svg" width="900" height="655" viewBox="0 0 900 655" role="img" aria-labelledby="title desc">
  <title id="title">Torques about the rod's center of mass</title>
  <desc id="desc">One rod leans right while attached to a cart that can move horizontally. The upward force P and rightward force N act at the pivot. Torques are measured about the center of mass, halfway along the rod. The angle theta is measured from the upward vertical to the rod. P has horizontal lever arm l sine theta, and N has vertical lever arm l cosine theta. Orange dashed arrows at the pivot show their perpendicular components, P sine theta directed up and left, and N cosine theta directed down and right. Thin projection guides connect these components to the full force arrowheads. A right-angle marker shows that the component direction is perpendicular to the rod. Gravity mg acts at the center of mass, so its lever arm about this point is zero. The center of mass is a reference point for calculating torque, not a fixed hinge.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #25384a;
      --line: #52677b;
      --muted: #66788a;
      --blue: #1763a6;
      --purple: #79509b;
      --orange: #ad4715;
      --cart: rgba(23, 99, 166, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --line: #b1c2d1;
        --muted: #859bb0;
        --blue: #75baff;
        --purple: #c9a3e6;
        --orange: #f4a66a;
        --cart: rgba(117, 186, 255, 0.08);
      }
    }
  </style>
  <defs>
    <marker id="force" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="var(--blue)"/></marker>
    <marker id="motion" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="var(--muted)"/></marker>
    <marker id="component" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--orange)"/></marker>
  </defs>
  <g font-family="DejaVu Serif, serif" font-size="24" fill="var(--ink)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Components use dashed arrows so they cannot be mistaken for extra forces. -->
    <path d="M40 36H90" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#force)"/>
    <text x="111" y="44" font-size="21">forces on the rod</text>
    <path d="M40 75H90" fill="none" stroke="var(--orange)" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#component)"/>
    <text x="111" y="83" font-size="21">perpendicular components</text>
    <!-- Faint cart context keeps the pivot attached to its moving support. -->
    <g opacity="0.6">
      <path d="M330 390V420" stroke="var(--line)" stroke-width="3"/>
      <rect x="238" y="420" width="184" height="63" rx="6" fill="var(--cart)" stroke="var(--line)" stroke-width="2"/>
      <circle cx="272" cy="499" r="15" fill="var(--line)"/>
      <circle cx="388" cy="499" r="15" fill="var(--line)"/>
      <path d="M145 516H485" stroke="var(--muted)" stroke-width="2"/>
    </g>
    <!-- Same angle as Figure 1: pivot (330,390), midpoint (420,222), upper end (510,54). -->
    <path id="rod" d="M330 390L510 54" fill="none" stroke="var(--line)" stroke-width="11"/>
    <!-- Dashed lines extend the directions in which the pivot forces act. -->
    <path id="P-line" d="M330 105V390" fill="none" stroke="var(--blue)" stroke-width="1.8" stroke-dasharray="6 6"/>
    <path id="N-line" d="M290 390H690" fill="none" stroke="var(--blue)" stroke-width="1.8" stroke-dasharray="6 6"/>
    <text x="40" y="131" font-size="21" fill="var(--blue)">P's line of action</text>
    <path d="M229 125H310L326 112" fill="none" stroke="var(--blue)" stroke-width="1.3"/>
    <!-- Perpendicular distances from the center of mass to each force line. -->
    <path id="P-lever" d="M330 222H420" fill="none" stroke="var(--purple)" stroke-width="2.5"/>
    <path d="M330 234H342V222" fill="none" stroke="var(--purple)" stroke-width="1.5"/>
    <path d="M330 216V228 M420 216V228" fill="none" stroke="var(--purple)" stroke-width="2"/>
    <text x="337" y="201" font-size="23" fill="var(--purple)">ℓ sin θ</text>
    <!-- The vertical dimension is offset to avoid overlapping the gravity arrow. -->
    <path d="M428 222H565" fill="none" stroke="var(--purple)" stroke-width="1.5" stroke-dasharray="4 5"/>
    <path id="N-lever" d="M555 222V390" fill="none" stroke="var(--purple)" stroke-width="2.5"/>
    <path d="M543 390V378H555" fill="none" stroke="var(--purple)" stroke-width="1.5"/>
    <path d="M549 222H561 M549 390H561" fill="none" stroke="var(--purple)" stroke-width="2"/>
    <text x="575" y="308" font-size="23" fill="var(--purple)">ℓ cos θ</text>
    <!-- All three arrows are forces on the rod, with their true application points. -->
    <path id="P" d="M330 390V272" fill="none" stroke="var(--blue)" stroke-width="3.5" marker-end="url(#force)"/>
    <text x="297" y="290" fill="var(--blue)">P</text>
    <path id="N" d="M330 390H638" fill="none" stroke="var(--blue)" stroke-width="3.5" marker-end="url(#force)"/>
    <text x="610" y="370" fill="var(--blue)">N</text>
    <path id="gravity" d="M420 222V335" fill="none" stroke="var(--blue)" stroke-width="3.5" marker-end="url(#force)"/>
    <text x="448" y="325" fill="var(--blue)">mg</text>
    <!-- Exact projections onto the direction perpendicular to the rod. -->
    <path id="P-projection" d="M330 272L280.882061447 363.686818632" fill="none" stroke="var(--orange)" stroke-width="1.5" stroke-dasharray="3 5"/>
    <path id="N-projection" d="M638 390L569.318136769 518.206144698" fill="none" stroke="var(--orange)" stroke-width="1.5" stroke-dasharray="3 5"/>
    <path id="P-perpendicular" d="M330 390L280.882061447 363.686818632" fill="none" stroke="var(--orange)" stroke-width="3.5" stroke-dasharray="6 5" marker-end="url(#component)"/>
    <path id="N-perpendicular" d="M330 390L569.318136769 518.206144698" fill="none" stroke="var(--orange)" stroke-width="3.5" stroke-dasharray="6 5" marker-end="url(#component)"/>
    <path id="perpendicular-mark" d="M339.444428 372.370401L357.074028 381.814829L347.629599 399.444428" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
    <path d="M220 336H249L286 365" fill="none" stroke="var(--orange)" stroke-width="1.3"/>
    <text x="120" y="342" font-size="23" fill="var(--orange)">P sin θ</text>
    <path d="M551 509L590 541H616" fill="none" stroke="var(--orange)" stroke-width="1.3"/>
    <text x="631" y="548" font-size="23" fill="var(--orange)">N cos θ</text>
    <!-- Theta is enclosed by the upward vertical and the rod. -->
    <path id="theta" d="M330 320A70 70 0 0 1 363.055499 328.296402" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <text x="343" y="309" font-size="23">θ</text>
    <circle id="pivot" cx="330" cy="390" r="5" fill="var(--ink)"/>
    <circle id="center" cx="420" cy="222" r="7" fill="var(--blue)"/>
    <!-- No curved arrow implies a fixed hinge at the center of mass. -->
    <path d="M428 216L570 135H592" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <text x="609" y="113" font-size="22">center of mass</text>
    <text x="609" y="144" font-size="21">torque reference</text>
    <text x="609" y="175" font-size="21">gravity's lever arm is zero</text>
    <path d="M325 397L278 438H190" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <text x="89" y="445" font-size="22">pivot</text>
    <path d="M180 568H312" fill="none" stroke="var(--muted)" stroke-width="2" marker-start="url(#motion)" marker-end="url(#motion)"/>
    <text x="180" y="604" font-size="22">pivot moves with the cart</text>
  </g>
</svg>
