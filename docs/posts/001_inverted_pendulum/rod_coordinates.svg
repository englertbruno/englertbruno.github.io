<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Where the cart and rod are</title>
  <desc id="desc">On the left, x is measured from a fixed zero to the cart pivot and theta clockwise from upright. On the right, the triangle from the pivot to the rod midpoint has horizontal side l sine theta and vertical side l cosine theta. The dot has coordinates x_c, y_c.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #25384a;
      --line: #52677b;
      --muted: #66788a;
      --divider: #94a3b8;
      --blue: #1763a6;
      --orange: #ad4715;
      --purple: #79509b;
      --wash: rgba(23, 99, 166, 0.07);
      --cart: rgba(23, 99, 166, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --line: #b1c2d1;
        --muted: #859bb0;
        --divider: #52677b;
        --blue: #75baff;
        --orange: #f4a66a;
        --purple: #c9a3e6;
        --wash: rgba(117, 186, 255, 0.07);
        --cart: rgba(117, 186, 255, 0.12);
      }
    }
  </style>
<defs><marker id="ink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="var(--ink)"/></marker><marker id="line" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="var(--line)"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="var(--blue)"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="var(--orange)"/></marker><marker id="purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="var(--purple)"/></marker></defs>
<g font-family="sans-serif" font-size="24" fill="var(--ink)" stroke-linecap="round" stroke-linejoin="round">

<text x="28" y="38" font-size="28">Position and angle</text>
<text x="488" y="38" font-size="28">Zoom in on the triangle</text>
<path d="M450 20V493" stroke="var(--divider)"/>
<path d="M190 335V90" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="82" y="98" font-size="22">upright</text>
<path d="M190 335L316 101" stroke="var(--orange)" stroke-width="10"/>
<text x="287" y="80" font-size="22" fill="var(--orange)">mass m</text>
<!-- The dimension line spans the full rod, not just its lower half. -->
<path d="M195 338L264 375 M320 103L390 141" stroke="var(--orange)" stroke-width="1.5"/>
<path d="M260 372.7L386 138.7" stroke="var(--orange)" stroke-width="1.5" marker-start="url(#orange)" marker-end="url(#orange)"/>
<text x="336" y="262" fill="var(--orange)">L</text>
<rect x="125" y="335" width="130" height="40" rx="5" fill="var(--cart)" stroke="var(--line)" stroke-width="2"/>
<text x="178" y="364">M</text>
<circle cx="148" cy="389" r="12" fill="var(--line)"/>
<circle cx="232" cy="389" r="12" fill="var(--line)"/>
<path d="M38 404H414" stroke="var(--muted)" stroke-width="2"/>
<path d="M190 270A65 65 0 0 1 220.8 277.8" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#ink)"/>
<text x="204" y="255">θ</text>
<circle cx="253" cy="218" r="7" fill="var(--blue)"/>
<path d="M130 218H245" stroke="var(--blue)" stroke-width="2"/>
<text x="36" y="208" font-size="21">center</text>
<text x="36" y="234" font-size="21">of mass</text>
<circle cx="190" cy="335" r="5" fill="var(--ink)"/>
<path d="M65 416V459 M190 405V459" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/>
<path d="M65 442H187" stroke="var(--blue)" stroke-width="3" marker-end="url(#blue)"/>
<text x="119" y="432" fill="var(--blue)">x</text>
<text x="58" y="490">0</text>
<text x="155" y="490" font-size="21">cart pivot</text>
<path d="M308 442H410" stroke="var(--line)" stroke-width="2" marker-end="url(#line)"/>
<text x="323" y="479" font-size="21">right (+)</text>
<!-- A right triangle, enlarged but at the same angle as the rod. -->
<path d="M602 364V130H728Z" fill="var(--wash)"/>
<path d="M602 364V130H728" fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M602 364L728 130" stroke="var(--orange)" stroke-width="5"/>
<path d="M602 149H621V130" fill="none" stroke="var(--blue)" stroke-width="2"/>
<path d="M602 305A59 59 0 0 1 630 312" fill="none" stroke="var(--ink)" stroke-width="2"/>
<text x="616" y="296">θ</text>
<text x="616" y="110" fill="var(--blue)">l sin θ</text>
<text x="502" y="242" fill="var(--blue)">l cos θ</text>
<text x="697" y="266" fill="var(--orange)">l = L / 2</text>
<circle cx="602" cy="364" r="5" fill="var(--ink)"/>
<circle cx="728" cy="130" r="7" fill="var(--blue)"/>
<text x="749" y="139" font-size="23">(x<tspan baseline-shift="sub" font-size="16">c</tspan>, y<tspan baseline-shift="sub" font-size="16">c</tspan>)</text>
<text x="558" y="405" font-size="22">pivot (x, 0)</text>
<text x="488" y="464" font-size="22">x<tspan baseline-shift="sub" font-size="16">c</tspan> = cart position + triangle width</text>
<text x="488" y="498" font-size="22">y<tspan baseline-shift="sub" font-size="16">c</tspan> = triangle height</text>

</g>
</svg>
